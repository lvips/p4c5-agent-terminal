## p4c5-agent-terminal IDF Component Manager Manifest
## 依赖清单 — 基于 xiaozhi 参考工程，按本项目需求裁剪
dependencies:
  ## ── 第三方库 ──
  espressif/esp_audio_codec: "~2.4.1"       # ES8311 + ES7210 codec 驱动
  espressif/esp_codec_dev: "~1.5.9"          # codec_dev 设备抽象层 (esp_audio_codec 依赖)
  78/esp-ml307: "*"                          # ML307C 4G 模组协议栈（任意版本，以兼容 IDF 5.4）
  # 78/uart-uhci 由 esp-ml307 v3.5.3 内部提供，无需显式声明
  # 78/esp-wifi-connect: "~3.1.1"             # WiFi 连接管理（M5 暂时禁用）
  lvgl/lvgl: "~9.4.0"                       # LVGL 图形库
  espressif/esp_lcd_touch_st7123: "^1.0.0"  # ST7123 触摸驱动
  # espressif/esp_hosted:                       # P4↔C5 WiFi 协处理（M5 暂时禁用）
  #   version: "2.12.3"
  #   rules:
  #     - if: target in [esp32p4]
  # espressif/esp_wifi_remote:                  # WiFi remote（M5 暂时禁用）
  #   version: "1.4.0"
  #   rules:
  #     - if: target in [esp32p4]

  ## ── 本项目自定义组件（路径引用） ──
  p4c5_board:
    path: ../components/p4c5_board
  p4c5_audio:
    path: ../components/p4c5_audio
  p4c5_display:
    path: ../components/p4c5_display
  p4c5_pmic:
    path: ../components/p4c5_pmic
  p4c5_4g:
    path: ../components/p4c5_4g
  p4c5_ui:
    path: ../components/p4c5_ui
  dsh_client:
    path: ../components/dsh_client

  ## ── xiaozhi 参考组件（路径引用，需从 xiaozhi 复制） ──
  esp_lcd_st7102:
    path: ../components/esp_lcd_st7102      # ST7102 LCD 驱动（从 xiaozhi 复制）
  pmic_axp2101:
    path: ../components/pmic_axp2101        # AXP2101 PMIC 驱动（从 xiaozhi 复制）

  ## ── IDF 版本 ──
  idf:
    version: ">=5.4.0"
